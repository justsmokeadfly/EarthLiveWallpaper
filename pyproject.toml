[project]
name = "earthlive"
version = "1.8.5"
description = "Automatically download Earth imagery and discover NASA, James Webb and Hubble space photos as Windows wallpapers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EarthLive Contributors" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]
ignore = ["E501", "E701", "E702", "SIM102", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"ui/main_window.py" = ["S606"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
