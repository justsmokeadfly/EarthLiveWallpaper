name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -ne "tag") { throw "Windows Release must be run from a version tag (vX.Y.Z)." }
          if ("${{ github.ref_name }}" -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: ${{ github.ref_name }}" }
          "RELEASE_VERSION=$($env:RELEASE_VERSION.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff — hardened files
        run: >-
          python -m ruff check
          config.py
          application/scheduler_service.py
          infrastructure/download/http_tile_downloader.py
          tests/test_config_validation.py
          tests/application/test_scheduler_service.py
          tests/infrastructure/test_http_tile_downloader.py

      - name: Mypy — hardened files
        run: >-
          python -m mypy
          --ignore-missing-imports
          --follow-imports=skip
          config.py
          application/scheduler_service.py
          infrastructure/download/http_tile_downloader.py
          tests/test_config_validation.py
          tests/application/test_scheduler_service.py
          tests/infrastructure/test_http_tile_downloader.py

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable application
        run: pyinstaller --clean --noconfirm EarthLive.spec

      - name: Verify EarthLive.exe
        shell: pwsh
        run: |
          $exe = "dist/EarthLive/EarthLive.exe"
          if (-not (Test-Path $exe)) { throw "EarthLive.exe was not created by PyInstaller." }
          if ((Get-Item $exe).Length -lt 1MB) { throw "EarthLive.exe looks suspiciously small." }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/EarthLive/*" -DestinationPath "EarthLive-$env:RELEASE_VERSION-windows-x64-portable.zip"

      - name: Verify Portable ZIP
        shell: pwsh
        run: |
          $zip = "EarthLive-$env:RELEASE_VERSION-windows-x64-portable.zip"
          if (-not (Test-Path $zip)) { throw "Portable ZIP was not created." }
          if ((Get-Item $zip).Length -lt 1MB) { throw "Portable ZIP looks suspiciously small." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Set installer version
        shell: pwsh
        run: |
          $path = "installer/EarthLive.iss"
          $content = Get-Content $path -Raw
          $content = $content -replace '#define MyAppVersion "[^"]+"', ('#define MyAppVersion "' + $env:RELEASE_VERSION + '"')
          Set-Content -Path $path -Value $content -Encoding UTF8

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\EarthLive.iss"'

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "installer/output/EarthLive-Setup-$env:RELEASE_VERSION.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created." }
          if ((Get-Item $installer).Length -lt 1MB) { throw "Installer looks suspiciously small." }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          name: EarthLive Wallpaper ${{ github.ref_name }}
          body: |
            ## 🌍 EarthLive Wallpaper ${{ github.ref_name }}

            ### Windows downloads
            - `EarthLive.exe` — standalone executable
            - `EarthLive-${{ env.RELEASE_VERSION }}-windows-x64-portable.zip` — Portable version
            - `EarthLive-Setup-${{ env.RELEASE_VERSION }}.exe` — Windows Installer

            ### Release validation
            - Ruff lint
            - mypy type-check
            - pytest
            - PyInstaller build verification
            - Portable ZIP verification
            - Inno Setup installer verification
          files: |
            dist/EarthLive/EarthLive.exe
            EarthLive-${{ env.RELEASE_VERSION }}-windows-x64-portable.zip
            installer/output/EarthLive-Setup-${{ env.RELEASE_VERSION }}.exe
