name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to release (for example v1.8.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ("$env:RELEASE_TAG" -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: $env:RELEASE_TAG" }

      - name: Checkout release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Set release version
        shell: pwsh
        run: |
          "RELEASE_VERSION=$($env:RELEASE_TAG.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Ensure release tag matches application version
        shell: pwsh
        run: |
          $project = Get-Content "pyproject.toml" -Raw
          if ($project -notmatch '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"') {
            throw "Cannot determine the version in pyproject.toml."
          }
          if ($Matches[1] -ne $env:RELEASE_VERSION) {
            throw "Tag $env:RELEASE_TAG does not match application version $($Matches[1])."
          }

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff — full repository
        run: python -m ruff check . --output-format=concise

      - name: Ruff — security rules
        run: python -m ruff check . --select S --output-format=concise

      - name: Mypy — full repository
        run: >-
          python -m mypy
          --ignore-missing-imports
          --follow-imports=skip
          .

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable application
        run: pyinstaller --clean --noconfirm EarthLive.spec

      - name: Verify EarthLive.exe
        shell: pwsh
        run: |
          $exe = "dist/EarthLive/EarthLive.exe"
          if (-not (Test-Path $exe)) { throw "EarthLive.exe was not created by PyInstaller." }
          if ((Get-Item $exe).Length -lt 1MB) { throw "EarthLive.exe looks suspiciously small." }

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/EarthLive/EarthLive.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--help" -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw "Packaged application timed out during --help smoke test."
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged application exited with code $($process.ExitCode)."
          }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/EarthLive/*" -DestinationPath "EarthLive-$env:RELEASE_VERSION-windows-x64-portable.zip"

      - name: Verify Portable ZIP
        shell: pwsh
        run: |
          $zip = "EarthLive-$env:RELEASE_VERSION-windows-x64-portable.zip"
          if (-not (Test-Path $zip)) { throw "Portable ZIP was not created." }
          if ((Get-Item $zip).Length -lt 1MB) { throw "Portable ZIP looks suspiciously small." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Set installer version
        shell: pwsh
        run: |
          $path = "installer/EarthLive.iss"
          $content = Get-Content $path -Raw
          $content = $content -replace '#define MyAppVersion "[^"]+"', ('#define MyAppVersion "' + $env:RELEASE_VERSION + '"')
          Set-Content -Path $path -Value $content -Encoding UTF8

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\EarthLive.iss"'

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "installer/output/EarthLive-Setup-$env:RELEASE_VERSION.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created." }
          if ((Get-Item $installer).Length -lt 1MB) { throw "Installer looks suspiciously small." }

      - name: Create stable latest installer alias
        shell: pwsh
        run: |
          $installer = "installer/output/EarthLive-Setup-$env:RELEASE_VERSION.exe"
          Copy-Item $installer "installer/output/EarthLive-Setup-Latest.exe" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          name: EarthLive Wallpaper ${{ env.RELEASE_TAG }}
          body: |
            ## 🌍 EarthLive Wallpaper ${{ env.RELEASE_TAG }}
            - Himawari Earth wallpapers with automatic updates.
            - NASA Astronomy Picture of the Day (APOD) gallery and optional scheduled wallpaper.
            - Favorites, local downloads, history, and GIF timelapse.
            - Wallpaper modes and per-monitor wallpaper support.
            - Russian and English interface.

            ### Windows downloads
            - `EarthLive-Setup-${{ env.RELEASE_VERSION }}.exe` — Windows Installer
            - `EarthLive-Setup-Latest.exe` — Installer stable filename
            - `EarthLive-${{ env.RELEASE_VERSION }}-windows-x64-portable.zip` — Complete portable folder (extract the entire ZIP including `_internal`; the EXE alone is not standalone)

            ### Validation
            Ruff, mypy, pytest, PyInstaller and Inno Setup checks run before publishing.
            Windows binaries are currently unsigned.
          files: |
            EarthLive-${{ env.RELEASE_VERSION }}-windows-x64-portable.zip
            installer/output/EarthLive-Setup-${{ env.RELEASE_VERSION }}.exe
            installer/output/EarthLive-Setup-Latest.exe
