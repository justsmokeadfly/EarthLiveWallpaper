name: Windows Release

on:
  push:
    branches:
      - "release/v1.1"
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_VERSION: "1.1.0"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable application
        run: pyinstaller --clean --noconfirm EarthLive.spec

      - name: Verify EarthLive.exe
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/EarthLive/EarthLive.exe")) {
            throw "EarthLive.exe was not created by PyInstaller."
          }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/EarthLive/*" -DestinationPath "EarthLive-${{ env.RELEASE_VERSION }}-windows-x64-portable.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Set installer version
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_VERSION }}"
          $path = "installer/EarthLive.iss"
          $content = Get-Content $path -Raw
          $replacement = '#define MyAppVersion "' + $version + '"'
          $content = $content -replace '#define MyAppVersion "[^"]+"', $replacement
          Set-Content -Path $path -Value $content -Encoding UTF8

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\EarthLive.iss"'

      - name: Verify installer
        shell: pwsh
        run: |
          if (-not (Test-Path "installer/output/EarthLive-Setup-${{ env.RELEASE_VERSION }}.exe")) {
            throw "Installer was not created."
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          name: EarthLive Wallpaper v1.1.0
          body: |
            ## 🇬🇧 English

            ### EarthLive Wallpaper v1.1.0

            First release of the clean EarthLive Wallpaper repository, based on the latest EarthLive codebase.

            - Updated release pipeline for v1.1.0.
            - Automated pytest validation.
            - Automated PyInstaller Windows build.
            - Automated Portable ZIP creation.
            - Automated Windows Installer creation.

            ## 🇷🇺 Русский

            ### EarthLive Wallpaper v1.1.0

            Первый релиз нового репозитория EarthLive Wallpaper на основе актуального кода EarthLive.

            - Обновлён pipeline сборки для v1.1.0.
            - Автоматическая проверка через pytest.
            - Автоматическая сборка Windows-программы через PyInstaller.
            - Автоматическое создание Portable ZIP.
            - Автоматическая сборка Windows Installer.
          files: |
            dist/EarthLive/EarthLive.exe
            EarthLive-${{ env.RELEASE_VERSION }}-windows-x64-portable.zip
            installer/output/EarthLive-Setup-${{ env.RELEASE_VERSION }}.exe
