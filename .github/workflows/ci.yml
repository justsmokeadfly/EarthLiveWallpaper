name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff — full repository
        run: |
          python -m ruff check . --fix --output-format=concise
          python -m ruff check . --output-format=concise

      - name: Ruff — security rules
        run: python -m ruff check . --select S --output-format=concise

      - name: Mypy — full repository
        run: >-
          python -m mypy
          --ignore-missing-imports
          --follow-imports=skip
          .

      - name: Pytest
        run: python -m pytest -q
